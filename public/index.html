<style>

  --etern:#8C86A8; --etern-text:#5A5470; --etern-ton:#E6E3EE;

  --f-label:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#171B33; --bg-alt:#232A4B; --paper:#1D2240; --ink:#E8E1D3; --ink-soft:#B8B2C8;
  --gold:#D9BC72; --gold-text:#D9BC72; --rule:#3B4268;
  --luft:#9DBEE0; --luft-text:#9DBEE0; --luft-ton:#1F2E4E;
  --eld:#E8836F; --eld-text:#E8836F; --eld-ton:#3A2230;
  --jord:#DCC56A; --jord-text:#DCC56A; --jord-ton:#33301F;
  --vatten:#86CF9B; --vatten-text:#86CF9B; --vatten-ton:#183A27;
  --etern:#B9B3D3; --etern-text:#B9B3D3; --etern-ton:#272644;
  --lantern-bg:#0F1226; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171B33; --bg-alt:#232A4B; --paper:#1D2240; --ink:#E8E1D3; --ink-soft:#B8B2C8;
  --gold:#D9BC72; --gold-text:#D9BC72; --rule:#3B4268;

*{box-sizing:border-box}

a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.1;text-wrap:balance;margin:0}
.label{font-family:var(--f-label);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text);font-weight:500}
.muted{color:var(--ink-soft)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.brand{display:flex;flex-direction:column;text-decoration:none;margin-right:auto}
.brand b{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1}
.brand span{font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-text)}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{font-family:var(--f-label);font-size:14px;text-decoration:none;padding:6px 10px;border-radius:999px;color:var(--ink-soft)}
nav.main a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.iconbtn{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:5px 10px;font-family:var(--f-label);font-size:13px;cursor:pointer}
main{padding-block:24px 48px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:90px}
@media (max-width:860px){.side{position:static}}
.panel{background:var(--paper);border:1px solid var(--rule);padding:16px}
.panel h3{font-size:22px;margin-bottom:8px}

.arch img{width:100%;height:100%;object-fit:cover;display:block}
.arch .ini{font-family:var(--f-display);color:var(--gold);font-weight:500}
.arch{position:relative}.arch.s-av img,.arch.s-av .ini,.arch.s-fri img,.arch.s-fri .ini,.arch.s-aktiv img,.arch.s-aktiv .ini{opacity:.5;filter:grayscale(1)}.arch[class*="s-"]:not(.lantern)::after{content:'';position:absolute;right:3px;bottom:3px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg);box-sizing:border-box}.arch.s-ledig::after{background:#2E9E57}.arch.s-upptagen::after{background:#EE8A1E}.arch.s-av::after{display:none}.arch.s-fri::after{background:#EE8A1E}.arch.s-aktiv::after{content:'\2605';background:none;border:0;width:auto;height:auto;right:2px;bottom:0;font-size:16px;line-height:1;color:#E8A700;text-shadow:0 0 3px var(--bg),0 0 6px var(--bg);animation:starpuls 1.5s ease-in-out infinite}.arch.big.s-aktiv::after{font-size:28px;right:6px;bottom:4px}@keyframes starpuls{0%,100%{transform:scale(.85);opacity:.75}50%{transform:scale(1.3);opacity:1}}@media (prefers-reduced-motion:reduce){.arch.s-aktiv::after{animation:none}}.arch.big::after{width:20px;height:20px;right:8px;bottom:8px}.react svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}.react{padding:4px 10px}
.arch.sm{width:44px;height:54px}.arch.sm .ini{font-size:26px}
.arch.xs{width:30px;height:37px;border-width:1.5px}.arch.xs .ini{font-size:18px}
.arch.lantern{background:var(--lantern-bg);border-color:var(--lantern-gold)}
/* composer */
.composer{background:var(--paper);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.composer textarea{width:100%;min-height:84px;border:1px solid var(--rule);background:var(--bg);padding:10px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
select,input[type=text],input[type=search]{border:1px solid var(--rule);background:var(--bg);padding:7px 10px;border-radius:2px;max-width:100%}
.btn{background:var(--ink);color:var(--bg);border:0;padding:8px 16px;font-family:var(--f-label);font-size:14px;cursor:pointer;border-radius:2px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule)}
.hint{font-family:var(--f-label);font-size:12px;color:var(--ink-soft)}
/* posts */
.feed{display:flex;flex-direction:column;gap:20px}
.post{background:var(--paper);border:1px solid var(--rule);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.post.reportage{border-top:3px solid var(--gold)}
.post.team{border-left:4px solid var(--etern)}
.phead{display:flex;gap:12px;align-items:flex-start}
.phead .who{display:flex;flex-direction:column;min-width:0}
.phead .name{font-family:var(--f-display);font-size:21px;font-weight:600;text-decoration:none;line-height:1.1}
.meta{font-family:var(--f-label);font-size:12.5px;color:var(--ink-soft);display:flex;gap:6px;flex-wrap:wrap}
.kind{font-family:var(--f-label);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text)}
.ptext{white-space:pre-wrap;overflow-wrap:anywhere}
.ctx{font-family:var(--f-label);font-size:12px;color:var(--ink-soft);border-left:2px solid var(--rule);padding-left:8px}
.ptitle{font-family:var(--f-display);font-size:26px;font-weight:600}
figure{margin:0}
figure img{width:100%;display:block;border:1px solid var(--rule)}
figcaption,.cap{font-family:var(--f-label);font-size:12px;color:var(--ink-soft);margin-top:6px}
.ai{display:inline-block;border:1px solid var(--rule);padding:0 6px;margin-left:4px;font-size:11px}
.photo-ph{border:1px dashed var(--gold);background:var(--bg);padding:18px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;aspect-ratio:3/2;justify-content:flex-end;max-width:100%;position:relative;overflow:hidden}
.photo-ph::before{content:"";position:absolute;inset:14px 50% auto auto;width:60px;height:74px;border:1.5px solid var(--rule);border-radius:999px 999px 0 0;transform:translateX(50%)}
.photo-ph b{font-family:var(--f-label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-text);font-weight:500}
.reacts{display:flex;gap:6px;flex-wrap:wrap}
.who{margin-top:6px;font-size:12.5px;color:var(--mute,#666)}.who summary{cursor:pointer;list-style:none;display:inline-block;text-decoration:underline;text-underline-offset:2px}.who summary::-webkit-details-marker{display:none}.whorow{display:flex;gap:6px;align-items:center;margin-top:4px}.whorow svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}.sr{position:absolute;left:-9999px}
.react{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:3px 10px;font-family:var(--f-label);font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.react[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.react .n{font-variant-numeric:tabular-nums}
.react.small{font-size:11.5px;padding:1px 8px}
.react{--c:#6b5b45;border:1px solid color-mix(in srgb,var(--c) 28%,transparent);background:color-mix(in srgb,var(--c) 7%,transparent);color:var(--c);padding:4px 12px 4px 9px;gap:7px;transition:transform .12s,background .15s,box-shadow .15s}
.react:hover{transform:translateY(-1px);background:color-mix(in srgb,var(--c) 15%,transparent);box-shadow:0 2px 6px color-mix(in srgb,var(--c) 22%,transparent)}
.react svg{width:18px;height:18px;stroke-width:1.9}
.react[data-typ="gilla"]{--c:#2D6CDF}.react[data-typ="skratta"]{--c:#D98E04}.react[data-typ="uppskatta"]{--c:#B5700F}.react[data-typ="omtanke"]{--c:#D6405A}
.react[aria-pressed="true"]{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 2px 8px color-mix(in srgb,var(--c) 35%,transparent)}
.react[aria-pressed="true"] svg{fill:rgba(255,255,255,.28)}
.react .n{font-weight:700;min-width:.7em;text-align:left}.react .n.z{opacity:.45;font-weight:500}
.react.small svg{width:15px;height:15px}

.comments{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--rule);padding-top:10px}
.cmt{display:flex;gap:10px}
.cmt .body{background:var(--bg);padding:8px 12px;min-width:0;flex:1;display:flex;flex-direction:column;gap:4px}
.cmt .body .n1{font-family:var(--f-display);font-size:17px;font-weight:600;text-decoration:none}
.cform{display:flex;gap:8px}
.cform input{flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-size:13px;padding:3px 12px;border-radius:999px;border:1px solid}
.pill.luft{color:var(--luft-text);background:var(--luft-ton);border-color:var(--luft)}
.pill.eld{color:var(--eld-text);background:var(--eld-ton);border-color:var(--eld)}
.pill.jord{color:var(--jord-text);background:var(--jord-ton);border-color:var(--jord)}
.pill.vatten{color:var(--vatten-text);background:var(--vatten-ton);border-color:var(--vatten)}
.pill.ljus{color:var(--lantern-gold);background:var(--lantern-bg);border-color:var(--lantern-gold)}
.chip{font-family:var(--f-label);font-size:12px;text-decoration:none;color:var(--gold-text);border-bottom:1px solid var(--rule)}
/* profile */
.prof{display:grid;grid-template-columns:320px minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:820px){.prof{grid-template-columns:minmax(0,1fr)}}
.prof .portrait{display:flex;flex-direction:column;gap:14px}
.prof .arch.big{width:100%;max-width:320px;aspect-ratio:4/5}
.prof .arch.big .ini{font-size:140px}
.wc{display:flex;flex-direction:column;gap:4px;align-items:flex-start;margin-top:10px}
.wc img{width:160px;max-width:100%;height:auto;border-radius:6px;border:1px solid var(--gold);display:block}
.prof h1{font-size:52px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule);margin:18px 0}
.tabs button{border:0;background:transparent;padding:8px 12px;font-family:var(--f-label);font-size:14px;cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.secs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.sec h3{font-family:var(--f-label);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:8px}
.sec p{margin:0 0 6px}
.sec .k{font-weight:600;color:var(--gold-text)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:6px}
.card .big{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.15}
.wheel{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-width:340px;aspect-ratio:1;border-radius:50%;overflow:hidden;border:2px solid var(--gold)}

.bars{display:flex;flex-direction:column;gap:6px;max-width:420px}
.bar{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;font-family:var(--f-label);font-size:13px}

.cal{display:flex;flex-direction:column;gap:8px}

.dm{display:flex;flex-direction:column;gap:10px}
.dm .msg{padding:8px 12px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere}
.dm .me{align-self:flex-end;background:var(--ink);color:var(--bg)}
.dm .them{align-self:flex-start;background:var(--paper);border:1px solid var(--rule)}
/* catalog */
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}
.person{display:flex;flex-direction:column;gap:6px;text-decoration:none;min-width:0}
.person .arch{width:100%;aspect-ratio:4/5}
.person .arch .ini{font-size:72px}
.person b{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.1}
.person small{font-family:var(--f-label);font-size:12px;color:var(--ink-soft)}
.teamhero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){.teamhero{grid-template-columns:minmax(0,1fr)}}
.teamhero img{width:100%;border:1px solid var(--rule);display:block}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.tcard{text-decoration:none;background:var(--paper);border:1px solid var(--rule);display:flex;flex-direction:column}
.tcard img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.tcard div{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tcard h3{font-size:26px}
.places{display:flex;flex-direction:column;gap:14px}
.place{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;border-bottom:1px solid var(--rule);padding-bottom:12px}
@media (max-width:620px){.place{grid-template-columns:minmax(0,1fr)}}
.faces{display:flex;flex-wrap:wrap;gap:6px}
.lantern{background:var(--lantern-bg);color:var(--lantern-fg);padding:28px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:620px){.lantern{grid-template-columns:minmax(0,1fr)}}
.lantern h1{color:var(--lantern-fg)}
.lantern .label{color:var(--lantern-gold)}
.empty{border:1px dashed var(--rule);padding:18px;color:var(--ink-soft)}
footer{border-top:1px solid var(--rule);padding-block:18px 28px;font-family:var(--f-label);font-size:12px;color:var(--ink-soft)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;font-family:var(--f-label);font-size:14px;z-index:20}
@media (prefers-reduced-motion:no-preference){.post{animation:in .25s ease-out both}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

const P = Object.fromEntries(TEAM.people.map(p=>[p.id,p]));
const TEAMS = TEAM.teams;
const TEAM_BY_NAME = Object.fromEntries(TEAMS.map(t=>[t.name,t]));
const EL = {Luft:'luft',Eld:'eld',Jord:'jord',Vatten:'vatten'};
const REACTIONS = [['gilla','Gilla'],['skratta','Skratta'],['uppskatta','Uppskatta'],['omtanke','Omtanke']];
const RICON={gilla:'<path d="M7 11v9H4v-9z"/><path d="M7 11l4-7c1.5 0 2.5 1 2.5 2.5V9h5.2c1.2 0 2 1 1.8 2.2l-1.2 7c-.2 1-1 1.8-2 1.8H7"/>',skratta:'<circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.500 3 4 3s3-1 4-3"/><path d="M9 9.500h.01M15 9.500h.01"/>',uppskatta:'<path d="M12 3l2.700 5.600 6.100.9-4.400 4.300 1 6.100L12 17l-5.400 2.900 1-6.100L3.200 9.500l6.100-.9z"/>',omtanke:'<path d="M12 20s-7-4.400-7-10a4 4 0 0 1 7-2.600A4 4 0 0 1 19 10c0 5.600-7 10-7 10z"/>'};
const NO_AI_REPLY = new Set(['mattias-seger']);
const state = {posts:[],comments:[],reactions:[],justNu:{},calendars:{},year:{},messages:[],photos:{},meta:{},uid:null,me:null,db:null,user:null,sample:null,dbReady:false};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}} };

/* tema */
(function(){const t=store.get('tema',null); if(t) document.documentElement.setAttribute('data-theme',t);
 $('#themeBtn').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.set('tema',n)};})();

function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const fmt = iso=>{if(!iso)return'';const d=new Date(iso);if(isNaN(d))return'';return d.toLocaleString('sv-SE',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Stockholm'})};
const fmtDay = iso=>new Date(iso).toLocaleDateString('sv-SE',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'Europe/Stockholm'});
function field(p,label){for(const s of p.sections||[])for(const it of s.items)if(it.label===label)return it.text;return ''}
function initials(n){return (n||'?').trim().charAt(0)}
function avatar(p,size='sm'){
  if(!p) return `<span class="arch ${size}"><span class="ini">?</span></span>`;
  if(p.special) return `<span class="arch ${size} lantern" aria-label="Lyktan, Virelai">${lanternSvg(size==='xs'?20:30)}</span>`;
  const st=statusOf(p),sc=st?' s-'+st.k:'',tt=st?` title="${esc(st.t)}"`:'';
  if(p.photo) return `<span class="arch ${size}${sc}"${tt}><img src="${esc(p.photo)}" alt="" loading="lazy"></span>`;
  return `<span class="arch ${size}${sc}"${tt}><span class="ini">${esc(initials(p.name))}</span></span>`;
}
function lanternSvg(w){return `<svg width="${w}" viewBox="0 0 520 720" aria-hidden="true"><defs><radialGradient id="lg${w}" cx="50%" cy="55%" r="50%"><stop offset="0%" stop-color="#FFF4D6"/><stop offset="35%" stop-color="#D9BC72" stop-opacity=".75"/><stop offset="100%" stop-color="#171B33" stop-opacity="0"/></radialGradient></defs><circle cx="260" cy="400" r="250" fill="url(#lg${w})"/><rect x="180" y="120" width="160" height="26" fill="#9A7832"/><path d="M190 146 L170 560 L350 560 L330 146 Z" fill="#FFF4D6" fill-opacity=".18" stroke="#D9BC72" stroke-width="10"/><path d="M260 300 C230 350 232 400 260 430 C288 400 290 350 260 300 Z" fill="#FFE7A8"/><rect x="160" y="560" width="200" height="30" fill="#9A7832"/></svg>`}
function elPill(p){if(!p)return'';if(p.special)return `<span class="pill ljus">${esc(p.character)} · ljuset</span>`;const c=EL[p.element];return c?`<span class="pill ${c}">${esc(p.character)} · ${esc(p.element)}</span>`:''}
function teamLinks(p){return (p.teams||[]).map(t=>TEAM_BY_NAME[t]?`<a class="chip" href="#team-${TEAM_BY_NAME[t].id}">${esc(t)}</a>`:esc(t)).join(' · ')}

/* författare */
const profCache={};
function authorOf(a){
  if(!a) return {name:'Okänd',p:null,href:null};
  if(a.startsWith('g:'))return {name:a.slice(2),p:null,href:null,viewer:true,gast:true};
  if(a.startsWith('u:')){const id=a.slice(2);return {name:(profCache[id]?.name)||(id===state.uid?(state.me?.name||'Du'):'Någon'),p:null,href:null,viewer:true,avatarUrl:profCache[id]?.avatarUrl}}
  const p=P[a];return p?{name:p.name,p,href:'#p-'+p.id}:{name:a,p:null,href:null};
}
async function resolveProfiles(){
  if(!state.user)return;
  const ids=new Set();for(const r of state.reactions||[])if(r.vem)ids.add(r.vem);for(const x of [...state.posts,...state.comments])for(const k of ['author','postat_av'])if(x[k]&&String(x[k]).startsWith('u:'))ids.add(String(x[k]).slice(2));
  if(state.uid)ids.add(state.uid);
  if(!ids.size)return;
  try{const ps=await state.user.profiles([...ids]);let changed=false;for(const id in ps){if(!profCache[id]||profCache[id].name!==ps[id].name){profCache[id]=ps[id];changed=true}}if(changed)render()}catch(e){}
}
function authorAvatar(au,size='sm'){if(au.viewer)return `<span class="arch ${size}">${au.avatarUrl?`<img src="${esc(au.avatarUrl)}" alt="">`:`<span class="ini">${esc(initials(au.name))}</span>`}</span>`;return avatar(au.p,size)}

/* synlighet: bara publicerade inlägg vars tid passerat */
function visible(x){const now=Date.now();const t=Date.parse(x.planerad_tid||x.tid||0);if((x.status||'publicerad')==='planerad'){return t&&t<=now}return !t||t<=now}
function postTime(x){return x.planerad_tid||x.tid}
function sortPosts(a){return a.filter(visible).sort((x,y)=>Date.parse(postTime(y))-Date.parse(postTime(x)))}

/* reaktioner */
function reactCounts(key,obj){
  const c={};const mine={};
  for(const [k] of REACTIONS){c[k]=(obj?.reaktioner?.[k]||[]).length}
  for(const r of state.reactions){if(r.target===key){c[r.typ]=(c[r.typ]||0)+1;if(r.vem===state.uid)mine[r.typ]=r._id}}
  return {c,mine};
}
function reactBar(key,obj,small){
  const {c,mine}=reactCounts(key,obj);
  const who=k=>(obj?.reaktioner?.[k]||[]).map(s=>P[s]?.name).filter(Boolean);
  return `<div class="reacts">${REACTIONS.map(([k,l])=>{const names=who(k);const tip=names.length?`${l}: ${names.slice(0,8).join(', ')}${names.length>8?' m.fl.':''}`:l;return `<button type="button" class="react${small?' small':''}" data-react="${esc(key)}" data-typ="${k}" aria-pressed="${mine[k]?'true':'false'}" aria-label="${esc(l)}: ${c[k]||0}" title="${esc(tip)}"><svg viewBox="0 0 24 24" aria-hidden="true">${RICON[k]}</svg><span class="n${c[k]?'':' z'}">${c[k]||0}</span></button>`}).join('')}</div>${whoList(key,obj,mine)}`;
}
function whoList(key,obj,mine){
  const rows=[];let tot=0;
  for(const [k,l] of REACTIONS){
    const names=(obj?.reaktioner?.[k]||[]).map(s=>P[s]?.name||s).filter(Boolean);
    for(const r of state.reactions){if(r.target===key&&r.typ===k){if(r.vem===state.uid)names.unshift('Du');else names.push(profCache[r.vem]?.name||'Medlem')}}
    if(names.length){tot+=names.length;rows.push(`<div class="whorow"><svg viewBox="0 0 24 24" aria-hidden="true">${RICON[k]}</svg><span class="sr">${esc(l)}: </span>${esc(names.join(', '))}</div>`)}
  }
  if(!tot)return '';
  return `<details class="who"><summary>${tot} ${tot===1?'reaktion':'reaktioner'} – visa vilka</summary>${rows.join('')}</details>`;
}
async function toggleReact(key,typ){
  if(!state.db||!state.uid){toast('Logga in i organisationen för att reagera.');return}
  const id=(key+'__'+state.uid+'__'+typ).replace(/[^A-Za-z0-9_\-.~:@+]/g,'-');
  const existing=state.reactions.find(r=>r._id===id);
  try{ if(existing) await state.db.doc('reactions/'+id).delete(); else await state.db.doc('reactions/'+id).set({target:key,vem:state.uid,typ,tid:new Date().toISOString()}); }catch(e){toast('Reaktionen sparades inte. Försök igen.')}
}

/* bilder */
function photoBlock(x){
  const vids=Array.isArray(x.videor)?x.videor:[];
  if(vids.length) return vids.filter(v=>v&&v.url).map(v=>`<figure><video controls playsinline preload="metadata" src="${esc(v.url)}" aria-label="${esc(v.alt||'')}" style="width:100%;display:block;border-radius:10px"></video><figcaption>${esc(v.text||'')}<span class="ai">AI-skapat klipp</span></figcaption></figure>`).join('');
  const vid=x.video;
  if(vid&&vid.url) return `<figure><video controls playsinline preload="metadata" src="${esc(vid.url)}" aria-label="${esc(vid.alt||'')}" style="width:100%;display:block;border-radius:10px"></video><figcaption>${esc(vid.text||'')}<span class="ai">AI-skapat klipp</span></figcaption></figure>`;
  const img=x.bild;
  if(img&&img.url) return `<figure><img src="${esc(img.url)}" alt="${esc(img.alt||img.text||'')}" loading="lazy"><figcaption>${esc(img.text||'')}${img.ai!==false?'<span class="ai">AI-skapad bild</span>':''}</figcaption></figure>`;
  const req=x.bildbestallning&&state.photos[x.bildbestallning];
  if(req&&req.status==='klar'&&req.bild_url) return `<figure><img src="${esc(req.bild_url)}" alt="${esc(req.motiv||'')}" loading="lazy"><figcaption>${esc(capOf(req))}<span class="ai">AI-skapad bild</span></figcaption></figure>`;
  if(x.bildbestallning){const r=req||{};return `<div class="photo-ph" role="img" aria-label="Bild kommer"><b>${esc({selfie:'Selfie',grupp:'Gruppbild',reportage:'Reportagebild',svar:'Svarsbild'}[r.typ]||'Bild')} kommer</b><span class="hint">${esc(r.motiv||'')}</span><span class="hint">${esc(capOf(r))}</span></div>`}
  return '';
}
function capOf(r){return [r.nar?fmt(r.nar):'',r.var,r.vader,r.temperatur&&!(r.vader||'').includes(r.temperatur)?r.temperatur:'',(r.ljus||'').split(' (')[0],r.hogtid].filter(Boolean).join(' · ')}
function ctxLine(x){const parts=[x.vader,x.temperatur&&!(x.vader||'').includes(x.temperatur)?x.temperatur:'',x.ljus,x.arstid,x.hogtid].filter(Boolean);return parts.length?`<span class="ctx" title="${esc(x.vader_kalla?'Väder: '+x.vader_kalla:'')}">${parts.map(esc).join(' · ')}</span>`:''}

/* inläggskort */
function postCard(x){
  const au=authorOf(x.author);const via=x.postat_av&&x.author&&!x.author.startsWith('u:')?authorOf(x.postat_av):null;
  const cms=state.comments.filter(c=>c.post===x._id&&visible(c)).sort((a,b)=>Date.parse(postTime(a))-Date.parse(postTime(b)));
  const kindLabel={reportage:'Reportage från Vreta',team:x.team?('Teamet · '+x.team):'Teamet',svar:'Svar'}[x.typ]||'';
  return `<article class="post ${esc(x.typ||'')}" id="post-${esc(x._id)}">
   <div class="phead">${au.href?`<a href="${au.href}" aria-label="${esc(au.name)}">${authorAvatar(au)}</a>`:authorAvatar(au)}
    <div class="who">${kindLabel?`<span class="kind">${esc(kindLabel)}</span>`:''}
     ${au.href?`<a class="name" href="${au.href}">${esc(au.name)}</a>`:`<span class="name">${esc(au.name)}</span>`}
     <span class="meta">${au.p?`<span>${esc((au.p.teams||[]).join(' · '))}</span>·`:''}${au.gast?`<span>Gäst på Vreta</span>·`:''}<time datetime="${esc(postTime(x))}">${esc(fmt(postTime(x)))}</time>${x.plats?`· <span>${esc(platsNamn(x.plats))}${x.land&&x.land!=='Sverige'?', '+esc(x.land):''}</span>`:''}${via?`· <span>postat via ${esc(via.name)}</span>`:''}</span>
    </div></div>
   ${ctxLine(x)}
   ${x.rubrik?`<h2 class="ptitle">${esc(x.rubrik)}</h2>`:''}
   <div class="ptext">${esc(x.text)}</div>
   ${photoBlock(x)}
   ${reactBar('post:'+x._id,x)}
   <div class="comments">${cms.map(c=>{const ca=authorOf(c.author);return `<div class="cmt">${ca.href?`<a href="${ca.href}" aria-label="${esc(ca.name)}">${authorAvatar(ca,'xs')}</a>`:authorAvatar(ca,'xs')}<div class="body">${ca.href?`<a class="n1" href="${ca.href}">${esc(ca.name)}</a>`:`<span class="n1">${esc(ca.name)}</span>`}<span>${esc(c.text)}</span><span class="meta"><time>${esc(fmt(postTime(c)))}</time></span>${reactBar('comment:'+c._id,c,true)}</div></div>`}).join('')}
    <form class="cform" data-post="${esc(x._id)}"><label class="hint" for="c-${esc(x._id)}" hidden>Kommentar</label><input id="c-${esc(x._id)}" type="text" placeholder="Skriv en kommentar" maxlength="1000"><button class="btn ghost" type="submit">Kommentera</button></form>
   </div>
  </article>`;
}

/* posta som */
function arstidFor(d){const m=d.getMonth()+1;return m===12||m<=2?'vinter':m<=4?'vår':m<=5?'försommar':m<=8?'sommar':m<=9?'tidig höst':'senhöst'}
function postAsOptions(id){
  const sel=store.get('postaSom','');
  return `<select id="${id}" aria-label="Posta som">${state.uid?`<option value="">Som mig själv${state.me?.name?' ('+esc(state.me.name)+')':''}</option>`:''}${TEAM.people.filter(p=>!p.special&&p.id!=='mattias-seger').map(p=>`<option value="${p.id}"${sel===p.id?' selected':''}>Som ${esc(p.name)}</option>`).join('')}</select>`;
}
function authorFromSelect(v){if(v)return v;return state.uid?'u:'+state.uid:null}

/* sidor */
function viewFeed(filterPlace){
  const pf=filterPlace??store.get('platsfilter','');
  const all=sortPosts(state.posts);
  const places=[...new Set(all.map(x=>platsNamn(x.plats)).filter(Boolean))].sort((a,b)=>a===VS?-1:b===VS?1:a.localeCompare(b,'sv'));
  const list=pf?all.filter(x=>platsNamn(x.plats)===platsNamn(pf)):all;
  return `<div class="grid2"><section>
   <form class="composer" id="composer"><span class="label">Nytt inlägg</span>
    <label class="hint" for="ptext" hidden>Text</label><textarea id="ptext" placeholder="Vad händer på Vreta, i teamet eller i livet?" maxlength="4000"></textarea>
    <div class="row">${postAsOptions('pas')}<label class="hint" for="pplats" hidden>Plats</label><input type="text" id="pplats" placeholder="Plats, t.ex. Vreta Solglänta" value="${esc(platsNamn(store.get('senastePlats','Vreta Solglänta')))}" maxlength="120"><button class="btn" type="submit" ${state.db?'':'disabled'}>Publicera</button></div>
    <span class="hint">${state.db?'Inlägget sparas för alla som öppnar sidan.':'Flödet läses in. Publicering kräver att sidan öppnas i claude.ai inom organisationen.'}</span>
   </form>
   <div class="row" style="margin-bottom:14px"><label class="label" for="pf">Plats</label><select id="pf"><option value="">Alla platser</option>${places.map(p=>`<option${p===platsNamn(pf)?' selected':''}>${esc(p)}</option>`).join('')}</select><span class="hint">${list.length} inlägg</span></div>
   <div class="feed">${list.length?list.map(postCard).join(''):`<div class="empty">${state.dbReady?'Inga inlägg här ännu. Skriv det första ovan.':'Flödet hämtas …'}</div>`}</div>
  </section>${sidebar()}</div>`;
}
function sidebar(){
  const leads=['eon','kelda','mykel','flora','linde','bjarke','polly'];
  const rep=sortPosts(state.posts).filter(x=>x.typ==='reportage').slice(0,3);
  return `<aside class="side">
   <div class="panel"><h3>Teamleads</h3><div class="faces">${leads.map(id=>`<a href="#p-${id}" title="${esc(P[id]?.name)}">${avatar(P[id],'sm')}</a>`).join('')}</div><p class="hint">Frågor mellan teamen går via teamleaderna.</p></div>
   <div class="panel"><h3>Senaste reportagen</h3>${rep.length?rep.map(r=>`<p style="margin:0 0 8px"><a href="#post-${esc(r._id)}" data-jump="${esc(r._id)}">${esc(r.rubrik||r.text.slice(0,60))}</a><br><span class="hint">${esc(fmt(postTime(r)))}</span></p>`).join(''):'<p class="hint">Tor Ekvall publicerar tre reportage om dagen.</p>'}<a class="chip" href="#reportage">Alla reportage</a></div>
   <div class="panel"><h3>Just nu</h3>${placeSummary(6)}<a class="chip" href="#platser">Alla platser</a></div>

    await state.db.collection('messages').add({trad,person:pid,tittare:state.uid,fran:pid,text:svar,tid:new Date().toISOString(),bildbestallning});
    if(st)st.textContent='';
  }catch(e){if(st)st.textContent=e&&e.code==='not_granted'?'Svar är avstängda eftersom sidan inte fick fråga Claude.':(e&&e.code==='rate_limited'?'För många frågor just nu. Vänta en stund.':'Inget svar den här gången. Meddelandet är sparat.')}
}

/* routing */
function route(){
  const h=(location.hash||'#flode').slice(1);
  document.querySelectorAll('nav.main a').forEach(a=>a.setAttribute('aria-current',a.getAttribute('href').slice(1)===h.split('-')[0]||(h.startsWith('team')&&a.getAttribute('href')==='#team')?'page':'false'));
  return h;
}
let lastHash='';
function render(){
  const h=route();const app=$('#app');
  const keep=document.activeElement&&document.activeElement.id&&['ptext','pplats','dmtext','fq'].includes(document.activeElement.id)?{id:document.activeElement.id,v:document.activeElement.value,s:document.activeElement.selectionStart}:null;
  const drafts={};document.querySelectorAll('.cform input, #ptext, #pplats, #dmtext').forEach(i=>{if(i.value)drafts[i.id]=i.value});
  const sy=window.scrollY;
  let html;
  if(h==='flode'||h==='')html=viewFeed();
  else if(h==='reportage')html=viewReportage();
  else if(h==='katalog')html=viewCatalog();
  else if(h==='team')html=viewTeams();
  else if(h.startsWith('team-'))html=viewTeam(h.slice(5));
  else if(h==='platser')html=viewPlaces();
  else if(h.startsWith('p-'))html=viewProfile(h.slice(2));
  else html=viewFeed();
  app.innerHTML=html;
  for(const id in drafts){const el=document.getElementById(id);if(el)el.value=drafts[id]}
  if(keep){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
  if(h==='katalog')fillCatalog();
  if(h!==lastHash){window.scrollTo(0,0);lastHash=h}else window.scrollTo(0,sy);
}
window.addEventListener('hashchange',render);

/* händelser */
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-react]');if(r){toggleReact(r.dataset.react,r.dataset.typ);return}
  const t=e.target.closest('[data-tab]');if(t){store.set('profilflik',t.dataset.tab);const p=P[location.hash.slice(3)];document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b===t?'true':'false'));$('#tabbody').innerHTML=profileTab(p,t.dataset.tab);return}
  const pl=e.target.closest('[data-place]');if(pl){e.preventDefault();store.set('platsfilter',pl.dataset.place);location.hash='#flode';render();return}
  const j=e.target.closest('[data-jump]');if(j){e.preventDefault();if(location.hash!=='#flode'){location.hash='#flode';setTimeout(()=>document.getElementById('post-'+j.dataset.jump)?.scrollIntoView(),50)}else document.getElementById('post-'+j.dataset.jump)?.scrollIntoView();return}
  if(e.target.id==='fclear'){store.set('katalogfilter',{q:'',team:'',el:'',kar:''});render()}
});
document.addEventListener('input',e=>{if(['fq'].includes(e.target.id))fillCatalog()});
document.addEventListener('change',e=>{
  if(['ft','fe','fk'].includes(e.target.id))fillCatalog();
  if(e.target.id==='pf'){store.set('platsfilter',e.target.value);render()}
  if(e.target.id==='pas'){store.set('postaSom',e.target.value)}
});
document.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='composer'){
    const text=$('#ptext').value.trim();const plats=platsNamn($('#pplats').value.trim().split(',')[0].trim());const author=authorFromSelect($('#pas').value);
    if(!text){toast('Skriv något först.');return} if(!author||!state.db){toast('Det går inte att publicera här.');return}
    store.set('senastePlats',plats);
    const doc={author,text,plats:plats,land:'Sverige',tid:new Date().toISOString(),status:'publicerad',typ:'vanlig',kalla:'tittare',arstid:arstidFor(new Date())};
    if(!author.startsWith('u:'))doc.postat_av='u:'+state.uid;
    try{await state.db.collection('posts').add(doc);$('#ptext').value='';toast('Publicerat')}catch(err){toast('Inlägget sparades inte. Försök igen.')}
  }
  if(f.classList.contains('cform')&&f.dataset.post){
    const inp=f.querySelector('input');const text=inp.value.trim();if(!text)return;
    const sel=store.get('postaSom','');const author=authorFromSelect(sel);
    if(!author||!state.db){toast('Det går inte att kommentera här.');return}
    const doc={post:f.dataset.post,author,text,tid:new Date().toISOString(),status:'publicerad',kalla:'tittare'};if(!author.startsWith('u:'))doc.postat_av='u:'+state.uid;
    try{await state.db.collection('comments').add(doc);inp.value='';}catch(err){toast('Kommentaren sparades inte.')}
  }
  if(f.id==='dmform'){const inp=$('#dmtext');const text=inp.value.trim();if(!text||!state.db)return;inp.value='';sendDm(f.dataset.person,text)}
});

/* data */
function snapList(coll,key,map){
  state.db.collection(coll).onSnapshot(s=>{const arr=s.docs.map(d=>({_id:d.id,...d.data()}));if(map)map(arr);else state[key]=arr;state.dbReady=true;resolveProfiles();scheduleRender()},err=>{console.warn(coll,err)});
}
let rt=null;function scheduleRender(){clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement;if(a&&a.matches&&a.matches('input,textarea,select')&&a.value){rt=setTimeout(scheduleRender,1500);return}render()},120)}
async function boot(){
  render();
  if(!window.claude)return;
  try{
    const [db,user,sample]=await Promise.all([claude.use('db'),claude.use('user'),claude.use('sample')]);
    state.db=db;state.user=user;state.sample=sample;
    if(user){state.uid=await user.id();try{state.me=await user.me()}catch(e){}}
    if(!db){render();return}
    snapList('posts','posts');snapList('comments','comments');snapList('reactions','reactions');
    snapList('just_nu',null,a=>{state.justNu=Object.fromEntries(a.map(x=>[x._id,x]))});
    snapList('calendars',null,a=>{state.calendars=Object.fromEntries(a.map(x=>[x._id,x]))});
    loadYear();
    snapList('photo_requests',null,a=>{state.photos=Object.fromEntries(a.map(x=>[x._id,x]))});
    snapList('people_meta',null,a=>{state.meta=Object.fromEntries(a.map(x=>[x._id,x]))});
    if(state.uid)state.db.collection('messages').where('tittare','==',state.uid).onSnapshot(s=>{state.messages=s.docs.map(d=>({_id:d.id,...d.data()}));if(location.hash.startsWith('#p-')&&$('#dmlist')){$('#tabbody').innerHTML=profileTab(P[location.hash.slice(3)],'skriv')}},()=>{});
    render();
  }catch(e){render()}
}
setInterval(()=>{if(state.posts.some(x=>x.status==='planerad'))scheduleRender()},60000);
boot();
</script>
